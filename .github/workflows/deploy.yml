name: Deploy to DigitalOcean

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy-to-digitalocean:
    name: Zero-Downtime Deploy to DigitalOcean
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy project files to DigitalOcean Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          source: "."
          target: "${{ secrets.DO_APP_DIR }}"

      - name: Execute Zero-Downtime Build & Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.DO_APP_DIR }}

            # Populate environment variables (.env)
            cat << 'EOF' > .env
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            MAILTRAP_API_TOKEN=${{ secrets.MAILTRAP_API_TOKEN }}
            SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}
            SENDER_NAME=${{ secrets.SENDER_NAME }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}
            SUPERMEMORY_API_KEY=${{ secrets.SUPERMEMORY_API_KEY }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            PORT=4000
            EOF

            # 1. Build new images first (old containers remain active serving traffic)
            docker compose build

            # 2. Re-create and restart containers instantly with new images (Zero Downtime)
            docker compose up -d --no-build --remove-orphans

            # 3. Prune dangling build images
            docker image prune -f
