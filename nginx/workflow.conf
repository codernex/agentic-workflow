# -------------------------------------------------------------------
# Nginx Configuration for Agentic Workflow Engine
# 
# 1. Frontend Web UI:  workflow.codernex.dev     -> http://127.0.0.1:4000
# 2. Backend Engine API: api-workflow.codernex.dev -> http://127.0.0.1:9000
# -------------------------------------------------------------------

# 1. Frontend Web App (workflow.codernex.dev)
server {
    server_name workflow.codernex.dev;

    # Redirect HTTP to HTTPS (uncomment when SSL certificate is active)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for HMR / Next.js updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 2. Backend Engine API (api-workflow.codernex.dev)
server {
    server_name api-workflow.codernex.dev;

    # Redirect HTTP to HTTPS (uncomment when SSL certificate is active)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Real-time WebSocket execution streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
